<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<!--
  Source for assets/og-cover.png — the link preview card.
  Rendered at exactly 1200x630, the size LinkedIn, WhatsApp, Facebook and X
  all crop from. Re-render with:
    og/render.sh
-->
<style>
  @font-face {
    font-family: 'Almoni Tzar';
    src: url('../fonts/almoni-tzar-bold-aaa.otf') format('opentype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Almoni Tzar';
    src: url('../fonts/almoni-tzar-regular-aaa.otf') format('opentype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Minecraft';
    src: url('../fonts/1_MinecraftRegular1.otf') format('opentype');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #131010;
    font-family: 'Almoni Tzar', sans-serif;
    color: #fff;
    direction: rtl;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* Brand wash, same palette as the hero */
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(46% 62% at 12% 18%, rgba(255,43,155,0.30), transparent 70%),
      radial-gradient(40% 55% at 62% 8%, rgba(123,92,255,0.24), transparent 70%);
  }

  /* The faint grid from the hosts section */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 54px 54px;
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 26% 50%, #000 10%, transparent 80%);
  }

  .hosts {
    position: absolute;
    left: -26px;
    bottom: -34px;
    height: 620px;
    -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
  }

  .copy {
    position: absolute;
    top: 0; right: 0;
    width: 700px;
    height: 630px;
    padding: 74px 64px 74px 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    font-family: 'Minecraft', monospace;
    font-size: 20px;
    letter-spacing: 0.16em;
    color: #ff2b9b;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 62px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.028em;
  }

  h1 em { font-style: normal; color: #ff2b9b; }

  .sub {
    margin-top: 26px;
    font-size: 27px;
    line-height: 1.35;
    color: rgba(255,255,255,0.84);
  }

  .when {
    margin-top: 38px;
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 14px;
    padding: 14px 26px 12px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 100px;
    font-size: 25px;
    background: rgba(255,255,255,0.05);
  }

  .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #ff383c;
    box-shadow: 0 0 14px rgba(255,56,60,0.95);
  }

  .brand {
    position: absolute;
    bottom: 46px;
    right: 64px;
    display: flex;
    align-items: center;
    gap: 22px;
    opacity: 0.85;
  }
  .brand img { height: 26px; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="grid"></div>

  <img class="hosts" src="../assets/hosts.png" alt="" />

  <div class="copy">
    <div class="eyebrow">Design to Code · משדר חי</div>
    <h1>
      איך לפרוץ כמעצב<br />
      של <em>העולם החדש</em>
    </h1>
    <p class="sub">
      להעלות קוד חי ראשון תוך 60 דקות,<br />
      ולהפוך לנכס הכי חזק בצוות.
    </p>
    <div class="when">
      <span class="dot"></span>
      יום רביעי 2.9 · 19:30 · ללא עלות
    </div>
  </div>

  <div class="brand">
    <img src="../assets/uxtra-logo.svg" alt="" />
    <img src="../assets/design-ai-logo.svg" alt="" />
  </div>
</body>
</html>
