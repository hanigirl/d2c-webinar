<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<!--
  Source for og/instagram-post.jpg — a square feed post.
  Not a crop of the link card: at 1:1 the wide layout has no room, so the
  hosts move under the copy and the type is sized for a phone screen.
  Re-render with og/render.sh
-->
<style>
  @font-face {
    font-family: 'Almoni Tzar';
    src: url('../fonts/almoni-tzar-bold-aaa.otf') format('opentype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Almoni Tzar';
    src: url('../fonts/almoni-tzar-regular-aaa.otf') format('opentype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Minecraft';
    src: url('../fonts/1_MinecraftRegular1.otf') format('opentype');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #131010;
    font-family: 'Almoni Tzar', sans-serif;
    color: #fff;
    direction: rtl;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(52% 40% at 78% 12%, rgba(255,43,155,0.32), transparent 70%),
      radial-gradient(50% 38% at 20% 6%, rgba(123,92,255,0.26), transparent 70%);
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 80% 46% at 50% 26%, #000 10%, transparent 82%);
  }

  .copy {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 44px 72px 0;
    text-align: center;
    z-index: 2;
  }

  .eyebrow {
    font-family: 'Minecraft', monospace;
    font-size: 24px;
    letter-spacing: 0.16em;
    color: #ff2b9b;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 90px;
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.03em;
  }

  .sub {
    margin-top: 22px;
    font-size: 31px;
    line-height: 1.3;
    color: rgba(255,255,255,0.86);
  }

  .when {
    margin-top: 32px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 15px 32px 12px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 100px;
    font-size: 29px;
    background: rgba(255,255,255,0.06);
  }

  .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff383c;
    box-shadow: 0 0 16px rgba(255,56,60,0.95);
  }

  /* The pair sit along the bottom edge, cropped at the waist. */
  .hosts {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    -webkit-mask-image: linear-gradient(to bottom, #000 86%, transparent 100%);
    z-index: 1;
  }

  .brand {
    position: absolute;
    bottom: 44px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 26px;
    opacity: 0.9;
    z-index: 3;
  }
  .brand img { height: 30px; }

  /* Matches the progress rail on slides 1-3 so the set reads as one carousel. */
  .dots {
    position: absolute;
    bottom: 18px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 9px;
    z-index: 3;
  }
  .dots span {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.26);
  }
  .dots span.on { background: #ff2b9b; }

  /* Keeps the logos legible where the photo runs behind them. */
  .brand::before {
    content: '';
    position: absolute;
    /* Full width is enough; bleeding past the edges widened the document,
       and in RTL that shifts what the headless capture frames. */
    inset: -34px 0;
    background: linear-gradient(to top, #131010 42%, transparent 100%);
    z-index: -1;
  }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="grid"></div>

  <div class="copy">
    <div class="eyebrow">Design to Code · משדר חי</div>
    <h1>
      איך לפרוץ כמעצב<br />
      של העולם החדש
    </h1>
    <p class="sub">
      להעלות קוד חי ראשון תוך 60 דקות,<br />
      ולהפוך לנכס הכי חזק בצוות.
    </p>
    <div class="when">
      <span class="dot"></span>
      יום רביעי 2.9 · 19:30 · ללא עלות
    </div>
  </div>

  <img class="hosts" src="../assets/hosts.png" alt="" />

  <div class="brand">
    <img src="../assets/uxtra-logo.svg" alt="" />
    <img src="../assets/design-ai-logo.svg" alt="" />
  </div>

  <div class="dots"><span></span><span></span><span></span><span class="on"></span></div>
</body>
</html>
